# Track DeepSeek Harness upstream releases and propose a plugin upgrade.
#
# The plugin vendors the core slot renderer verbatim (src/client/vendor/renderer)
# and pins the harness build ref in core-pin.json (which build-release.yml
# reads). When upstream cuts a new dsh-v* release, this workflow:
#
#   1. compares the new release's tree with the currently pinned commit and
#      checks whether the CONTACT SURFACES this plugin consumes changed
#      (the vendored renderer files + ui-conversation/ui-session/ui-layout
#      contracts + the icon sources) — a tag that only bumps the version, or
#      moves work outside those surfaces, is skipped silently (no empty PRs);
#   2. if a surface changed: rewrites the pin, re-vendors the renderer
#      (scripts/upgrade-core.mjs), checks out + builds the harness at the NEW
#      commit, installs, and runs the full `pnpm run check`;
#   3. if everything is green, opens a PR "chore: track dsh-vX.Y.Z" whose body
#      tells you whether the built bundle changed (the signal for whether a
#      patch release is meaningful).
#
# The PR touches core-pin.json, never anything under .github/workflows: the
# default GITHUB_TOKEN cannot push workflow changes, so a branch that edited
# build-release.yml was rejected by GitHub outright.
#
# Releasing stays a manual, PR-gated action: merge the PR, then cut the release
# (the existing build-release workflow attaches the tarball). A failed adaption
# never ships anything — the PR simply does not merge.
#
# Trigger: every 6 hours + manual dispatch (dispatch `force: true` to exercise
# the pin/PR half even when no contact surface changed).
name: upstream-track

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      # The scheduled path stays silent when a release touches no contact
      # surface (upgrade-core exits 3). This input forces the pin + re-vendor +
      # full check + PR, so the PR-opening half of the tracker is exercised
      # even for a tag that needs no adaption. `--force` skips only the
      # contact-surface gate; every other guard still applies.
      force:
        description: 'Re-pin even when no contact surface changed (opens a tracking PR)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  PNPM_VERSION: 11.7.0
  NODE_VERSION: 22

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: dsh-split-panes

      - name: Resolve pin, latest upstream tag, and the contact-surface gate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dsh-split-panes
        run: |
          set -euo pipefail
          # The pin is data (core-pin.json); build-release.yml reads it. Keeping
          # it out of the workflow matters: GITHUB_TOKEN cannot push workflow
          # changes, so a PR that edited build-release.yml was rejected.
          OLD=$(node -p 'require("./core-pin.json").ref')
          echo "current pin: $OLD ($(node -p 'require("./core-pin.json").tag'))"
          if [ -z "$OLD" ]; then echo "no pinned ref found"; exit 0; fi

          # Newest published dsh release (prereleases included).
          LATEST=$(gh api 'repos/deepseek-ai/deepseek-harness/releases?per_page=100' --jq '[.[] | select(.tag_name | startswith("dsh-v")) | .tag_name][0]')
          echo "latest upstream: $LATEST"
          if [ -z "$LATEST" ]; then echo "no upstream dsh release found"; exit 0; fi

          # Peel to the COMMIT: the plain tag ref of an annotated tag is the tag
          # object's sha, which never equals the commit pinned in the workflow —
          # the "already tracking" check would never fire and the compare below
          # would run against a tag object. `^{}` gives the commit; a
          # lightweight tag has no peeled ref, so fall back to the plain one.
          TAG_REPO='https://github.com/deepseek-ai/deepseek-harness.git'
          NEW_SHA=$(git ls-remote "$TAG_REPO" "refs/tags/$LATEST^{}" | cut -f1)
          if [ -z "$NEW_SHA" ]; then
            NEW_SHA=$(git ls-remote "$TAG_REPO" "refs/tags/$LATEST" | cut -f1)
          fi
          echo "new sha: $NEW_SHA"
          if [ -z "$NEW_SHA" ]; then echo "could not resolve $LATEST"; exit 0; fi
          if [ "$OLD" = "$NEW_SHA" ]; then echo "already tracking $LATEST — nothing to do"; exit 0; fi

          # GitHub compare file list feeds the contact-surface gate (exit 3 = skip).
          gh api "repos/deepseek-ai/deepseek-harness/compare/$OLD...$NEW_SHA" > compare.json
          # UPPERCASE on purpose: every later step reads $OLD / $LATEST / $NEW_SHA.
          # Writing lowercase names here made all three expand to the empty
          # string in the steps below (a shell variable that was never set),
          # which then fed an empty tag and sha to upgrade-core.
          printf 'OLD=%s\nLATEST=%s\nNEW_SHA=%s\n' "$OLD" "$LATEST" "$NEW_SHA" >> "$GITHUB_ENV"

      # Checked out BEFORE the re-vendor: upgrade-core copies the vendored
      # renderer and the pane icons straight out of this tree, so it must
      # already be on disk. Only the sources are needed here — no install.
      - name: Checkout harness at the new pin
        if: env.NEW_SHA != ''
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.NEW_SHA }}
          # Sibling of the plugin checkout: the plugin's devDependencies are
          # `link:../dsh2026/deepseek-harness/...` (same layout as
          # build-release.yml). Nesting it under the plugin dir would resolve
          # the links one level too deep.
          path: dsh2026/deepseek-harness
          fetch-depth: 1

      - name: Pin + re-vendor (skips when no contact surface changed)
        id: upgrade
        if: env.NEW_SHA != ''
        working-directory: dsh-split-panes
        run: |
          set +e
          FORCE=''
          if [ "${{ inputs.force }}" = 'true' ]; then FORCE='--force'; fi
          node scripts/upgrade-core.mjs "$LATEST" "$NEW_SHA" --files compare.json --skip-check $FORCE
          code=$?
          set -e
          echo "upgrade exit: $code"
          if [ "$code" = "3" ]; then
            echo "no contact surface changed — nothing to upgrade"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" != "0" ]; then
            echo "upgrade failed (exit $code)"
            exit $code
          fi

      - name: Skip when untouched
        if: steps.upgrade.outputs.skip == 'true'
        run: echo "upstream release does not touch this plugin's surfaces — done"

      - name: Setup pnpm
        if: steps.upgrade.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        if: steps.upgrade.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: dsh2026/deepseek-harness/pnpm-lock.yaml

      - name: Build harness
        if: steps.upgrade.outputs.skip != 'true'
        working-directory: dsh2026/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Install plugin
        if: steps.upgrade.outputs.skip != 'true'
        working-directory: dsh-split-panes
        run: pnpm install --frozen-lockfile

      - name: Full check (drift + typecheck + tests + build)
        if: steps.upgrade.outputs.skip != 'true'
        working-directory: dsh-split-panes
        run: pnpm run check

      - name: Did the built bundle change?
        if: steps.upgrade.outputs.skip != 'true'
        id: bundle
        working-directory: dsh-split-panes
        run: |
          if git diff --exit-code --quiet -- lib/client.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "bundle unchanged — pin-only tracking PR"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "bundle CHANGED — a patch release is meaningful after merge"
          fi

      - name: Open / update the tracking PR
        if: steps.upgrade.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dsh-split-panes
        run: |
          BRANCH="chore/upstream-$LATEST"
          # Only an OPEN PR means there is nothing to do. `gh pr view <branch>`
          # also matches a CLOSED one, so closing a tracking PR (or deleting its
          # branch) used to make this step exit early forever: the tracker went
          # silent for that tag instead of re-opening the PR.
          OPEN_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" != "0" ]; then
            echo "PR already open: $BRANCH"
            exit 0
          fi
          git config user.name 'dsh-split-panes bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$BRANCH"
          # Everything the upgrade flow can rewrite: the pin, the vendored
          # renderer, the extracted pane icons, and the two sync scripts.
          # NOTHING under .github/workflows may be staged: GITHUB_TOKEN has no
          # `workflows` permission, and such a push is rejected by GitHub.
          git add core-pin.json \
                  scripts/sync-renderer-vendor.mjs scripts/sync-icons.mjs scripts/upgrade-core.mjs \
                  src/client/vendor src/client/icons.tsx
          git commit -m "chore: track $LATEST"
          git push origin "$BRANCH"
          BUNDLE_CHANGED="${{ steps.bundle.outputs.changed }}"
          FORCED="${{ inputs.force }}"
          awk -v changed="$BUNDLE_CHANGED" -v forced="$FORCED" -v tag="$LATEST" '
            BEGIN {
              print "## Upstream tracking: " tag
              print ""
              print "Contact surfaces changed (vendored renderer / conversation contracts), so the plugin was re-pinned and the renderer re-vendored."
              if (forced == "true") {
                print ""
                print "> Opened by a forced manual dispatch: this tag touches no contact surface, so the"
                print "> pin move is the only change. Merging is optional and shipping a release is not warranted."
              }
              print ""
              print "- Bundle: " (changed == "true" ? "**changed** — merge then bump the patch version and release" : "unchanged — pin maintenance only, no release needed")
              print ""
              print "Release stays manual: merge this PR, then cut the release (build-release attaches the tarball)."
            }' > PR_BODY.md
          gh pr create --base main --head "$BRANCH" \
            --title "chore: track $LATEST" \
            --body-file PR_BODY.md