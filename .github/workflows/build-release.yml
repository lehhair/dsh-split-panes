# Build the plugin and attach the packed tarball to a GitHub Release.
#
# The plugin's devDependencies are `link:` into a local deepseek-harness
# checkout (the plugin repo's build-time dependency source), so this workflow
# reads the pinned core ref from core-pin.json, checks that harness out, and
# builds it before building the plugin. The link: targets resolve at
# ../dsh2026/deepseek-harness/..., the layout this repo's pnpm-lock.yaml
# records. The vendored slot renderer (src/client/vendor/renderer) is a verbatim
# copy of that release and `pnpm run check` fails on any drift, so the pin must
# match the vendor; scripts/upgrade-core.mjs moves both together.
#
# The pin lives in core-pin.json rather than here because the default
# GITHUB_TOKEN cannot push anything under .github/workflows, so the upstream
# tracker could not otherwise open a PR that moves it.
#
# Triggered on release publish (attach to that release) or manually.
name: build-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the tarball to (defaults to the latest release)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          # The plugin's devDependencies are `link:../dsh2026/...` relative to
          # the plugin root; check it into a named subdir so that relative
          # target lands on the harness checkout below (GITHUB_WORKSPACE itself
          # already carries the repo name, so a root checkout would shift the
          # link target one level too high).
          path: dsh-split-panes

      - name: Read the pinned core ref
        id: core
        working-directory: dsh-split-panes
        run: |
          # The pin is data (core-pin.json), not a line in this file: the
          # default GITHUB_TOKEN cannot push workflow changes, so the upstream
          # tracker could not otherwise open a PR that moved the pin.
          node -e "const pin=require('./core-pin.json');console.log('ref='+pin.ref);console.log('tag='+pin.tag)" >> "$GITHUB_OUTPUT"
          echo "pinned core: $(node -p 'require("./core-pin.json").tag')"

      - name: Checkout deepseek-harness (plugin build-time dependency source)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # From core-pin.json; keep in sync with the vendored renderer.
          ref: ${{ steps.core.outputs.ref }}
          path: dsh2026/deepseek-harness
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the harness's declared packageManager (pnpm@11.7.0): pnpm 10
          # installs a different public-hoist layout, which breaks resolution
          # from the linked harness sources during the plugin tests.
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dsh2026/deepseek-harness/pnpm-lock.yaml

      - name: Build harness (tsc emits lib/types, tsdown emits lib runtimes)
        working-directory: dsh2026/deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: 'Install plugin (link: targets now exist)'
        working-directory: dsh-split-panes
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build
        working-directory: dsh-split-panes
        run: pnpm run check

      - name: Pack release tarball
        working-directory: dsh-split-panes
        run: |
          # The devDependencies are link: into the harness checkout; strip them
          # from the packed manifest (npm pack reads the working package.json)
          # so a plain consumer install never tries to resolve those links.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));delete p.devDependencies;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          mkdir -p dist
          npm pack --pack-destination dist
          # Rename to a versionless fixed name so
          # releases/latest/download/dsh-external-dsh-split-panes.tgz always
          # points at the newest build.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const fixed=p.name.replace(/^@/,'').replace('/','-')+'.tgz';const packed=fs.readdirSync('dist').find(f=>f.endsWith('.tgz'));if(packed&&packed!==fixed){fs.renameSync('dist/'+packed,'dist/'+fixed)}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dsh-split-panes
        run: |
          # Release-publish runs attach to THAT release; a manual dispatch
          # attaches to the tag input, else to the latest release.
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          echo "attaching $(ls dist/*.tgz) to $TAG"
          gh release upload "$TAG" dist/*.tgz --clobber